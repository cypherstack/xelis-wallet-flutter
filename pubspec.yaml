name: xelis_wallet_flutter
description: Shared Flutter bindings for the native XELIS wallet runtime.
version: 0.4.0
repository: https://github.com/xelis-project/xelis-wallet-flutter
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  freezed_annotation: 3.1.0

dev_dependencies:
  build_runner: ^2.16.1
  freezed: 4.0.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
